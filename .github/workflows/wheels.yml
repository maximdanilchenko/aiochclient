name: Wheels
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6
        env:
          CIBW_BUILD: "cp3{10,11,12,13,14,15}-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: >-
            python -c "from aiochclient._types import what_py_type; assert what_py_type('Int64').convert(b'42') == 42"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  test:
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15.0-rc.3"]
    env:
      PIP_ONLY_BINARY: ":all:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ contains(matrix.python-version, 'rc') }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-x86_64
          path: wheelhouse
      - name: Install the built wheel
        run: |
          python -m pip install pytest pytest-asyncio pytest-cov aiohttp httpx sqlparse tzdata
          python -m pip install --no-index --no-deps --find-links wheelhouse aiochclient
          python -c "import aiochclient._types"
      - name: Start ClickHouse
        run: make docker-clickhouse
      - name: Test the installed wheel
        run: |
          cp tests.py pyproject.toml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -m pytest tests.py -o asyncio_mode=auto --cov aiochclient -vv
